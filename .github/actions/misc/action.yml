name: 'Setup Misc Configs'
description: 'Set up kernel configuration fragment with miscellaneous options'
inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.12)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  sublevel:
    description: 'Sublevel of kernel version (e.g., 1)'
    required: true
  variant:
    description: 'Build variant (Normal, Bypass, Wild, boot-time)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          # rtwo fork: Motorola FCM-7 needs these built in (VINTF dialog fix)
          CONFIG_L2TP=y
          CONFIG_PPP=y
          CONFIG_PPPOL2TP=y
          CONFIG_PPP_BSDCOMP=y
          CONFIG_PPP_DEFLATE=y
          CONFIG_PPP_MPPE=y
          CONFIG_PPTP=y
          # rtwo fork: vendor qca_cld3_kiwi and qca6490 modules need relayfs
          # (relay_open, relay_close, ...); GKI defconfig leaves CONFIG_RELAY
          # unset, so the modules fail to load and wlan0 never appears.
          CONFIG_RELAY=y
          # rtwo fork: keep every exported symbol. Unused-ksym trimming
          # drops non-KMI exports such as relay_file_operations that the
          # vendor qca_cld3 modules link against, so the module load
          # fails with Unknown symbol even when relayfs itself is built in.
          CONFIG_TRIM_UNUSED_KSYMS=n
          